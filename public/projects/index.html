<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSPIDEV | Premium Creative-Tech Studio</title>
    <meta name="description" content="INSPIDEV — A world-class cinematic anti-gravity luxury creative-tech studio.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Film Grain -->
    <div class="film-grain"></div>

    <!-- Background Blobs -->
    <div class="blobs-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- ====== SINGLE PERSISTENT LOGO ====== -->
    <img id="the-logo" src="edited-photo (1).png" alt="INSPIDEV" class="the-logo">

    <!-- ====== LOADING BAR ====== -->
    <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- Hamburger Menu Button -->
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Navigation">
        <span class="line line-1"></span>
        <span class="line line-2"></span>
        <span class="line line-3"></span>
    </button>

    <!-- ====== MAIN CONTENT ====== -->
    <main id="main-content" class="main-hidden">

        <section id="hero" class="hero-section">

            <!-- Left: Logo landing + ESTB + Socials -->
            <div class="hero-left" id="hero-left">
                <div class="brand-row">
                    <div class="logo-landing" id="logo-landing"></div>
                    <div class="hero-estb" id="hero-estb">
                        <span class="estb-text">ESTB 2026</span>
                    </div>
                </div>
                <div class="social-links" id="social-links">
                    <a href="https://www.instagram.com/inspidevv/" target="_blank" rel="noopener noreferrer" class="social-ball" aria-label="Instagram">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </a>
                    <a href="https://www.linkedin.com/in/inspidev-og-399b2b316/" target="_blank" rel="noopener noreferrer" class="social-ball" aria-label="LinkedIn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                            <rect x="2" y="9" width="4" height="12"></rect>
                            <circle cx="4" cy="4" r="2"></circle>
                        </svg>
                    </a>
                    <a href="https://www.youtube.com/@baerozgaar.0G" target="_blank" rel="noopener noreferrer" class="social-ball" aria-label="YouTube">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"></path>
                            <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="currentColor"></polygon>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- Right Sliding: Glass Nav Box -->
            <div class="nav-glass-box glass-panel" id="nav-glass-box">
                <a href="#what-we-do" class="nav-link">What We Do</a>
                <a href="#visionaries" class="nav-link">Visionaries We’ve Built With</a>
                <a href="#projects" class="nav-link">Signature Projects</a>
                <a href="#contact" class="nav-link">Contact Us</a>
            </div>

        </section>

        <!-- Million Dollar Section -->
        <section id="million-dollar" class="section md-section">
            <div class="content-center">
                <div class="morph-container">
                    <span id="morph-symbol" class="morph-symbol">$</span>
                </div>
                <h2 class="gradient-text large-text md-text">MILLION DOLLAR QUESTION</h2>
            </div>
        </section>

        <!-- Final Section -->
        <section id="final-section" class="section final-section">
            <div class="content-center">
                <h2 class="gradient-text large-text">WHAT WE DO?</h2>
            </div>
            <div class="small-bubbles-container">
                <div class="s-blob s-blob-1"></div>
                <div class="s-blob s-blob-2"></div>
                <div class="s-blob s-blob-3"></div>
                <div class="s-blob s-blob-4"></div>
                <div class="s-blob s-blob-5"></div>
            </div>
        </section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
